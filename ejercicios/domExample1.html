<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo el DOM</title>
    <style>
        /* CSS: Estilos visuales sencillos */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 40px;
        }

        .tarjeta {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            transition: color 0.3s;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <!-- Elementos que manipularemos desde JavaScript -->
        <h1 id="titulo">Texto Original</h1>
        <p id="descripcion">Haz clic en los botones para modificar este contenido mediante el DOM.</p>

        <!-- Botones de interacción -->
        <button id="btnTexto">Cambiar Texto</button>
        <button id="btnColor">Cambiar Color</button>
    </div>

    <script>
        // JS: Manipulación del DOM

        // 1. Buscamos y guardamos los elementos del HTML en variables
        let titulo = document.getElementById("titulo");
        let descripcion = document.getElementById("descripcion");
        let btnTexto = document.getElementById("btnTexto");
        let btnColor = document.getElementById("btnColor");

        // 2. Escuchamos el clic en el botón de cambiar texto
        btnTexto.addEventListener("click", function() {
            titulo.innerText = "¡Texto Cambiado!";
            descripcion.innerText = "¡Acabas de modificar el texto del HTML usando JavaScript!";
        });

        // 3. Escuchamos el clic en el botón de cambiar color
        btnColor.addEventListener("click", function() {
            titulo.style.color = "#28a745"; // Cambia el color a verde
            descripcion.style.color = "#6c757d";
        });
    </script>

</body>
</html>
